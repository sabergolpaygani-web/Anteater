name: Build Anteater v24

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Anteater v24 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Locate Android SDK
      # ==========================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK path was not found."
            exit 1
          fi

          echo "Using SDK:"
          echo "$SDK"

          echo
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null \
            | head -1)

          if [ -z "$SDKMANAGER" ]; then

            echo "sdkmanager was not found inside Android SDK."

            echo
            echo "SDK directory:"
            find "$SDK" \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo
          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager directory:"
          echo "$SDKMANAGER_DIR"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"


      # ==========================================
      # 4. Verify sdkmanager
      # ==========================================
      - name: Verify sdkmanager
        shell: bash
        run: |
          set -eux

          echo "SDKMANAGER=$SDKMANAGER"

          test -f "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ==========================================
      # 5. Install Android SDK 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -eux

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | "$SDKMANAGER" --licenses >/dev/null || true


      # ==========================================
      # 6. Verify Android SDK 36
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-36"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          test -d \
            "$ANDROID_SDK_ROOT/platform-tools"

          echo
          echo "Android SDK 36 is ready."


      # ==========================================
      # 7. Gradle 8.13
      # ==========================================
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      # ==========================================
      # 8. Check Anteater ZIP
      # ==========================================
      - name: Check Anteater v24 source
        shell: bash
        run: |
          set -eux

          test -f Anteater_24_FINAL.zip

          ls -lh Anteater_24_FINAL.zip

          echo "Anteater v24 source found."


      # ==========================================
      # 9. Extract Anteater
      # ==========================================
      - name: Extract Anteater v24
        shell: bash
        run: |
          set -eux

          rm -rf anteater-src

          mkdir -p anteater-src

          unzip -q \
            Anteater_24_FINAL.zip \
            -d anteater-src

          echo
          echo "Extracted files:"

          find anteater-src \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -300


      # ==========================================
      # 10. Locate Android project
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -eux

          APP_GRADLE=$(find anteater-src \
            -type f \
            -path "*/app/build.gradle.kts" \
            | head -1)

          if [ -z "$APP_GRADLE" ]; then

            echo "ERROR:"
            echo "app/build.gradle.kts was not found."

            find anteater-src \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo
          echo "APP_GRADLE:"
          echo "$APP_GRADLE"

          echo
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 11. Verify Anteater v24
      # ==========================================
      - name: Verify Anteater v24
        shell: bash
        run: |
          set -eux

          test -f \
            "$PROJECT_DIR/app/build.gradle.kts"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/example/spotvolume/MainActivity.kt"

          echo
          echo "========== VERSION =========="

          grep -n "versionCode" \
            "$PROJECT_DIR/app/build.gradle.kts" || true

          grep -n "versionName" \
            "$PROJECT_DIR/app/build.gradle.kts" || true

          echo
          echo "========== ANTEATER =========="

          grep -Rni "Anteater" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "========== AUTO SCAN =========="

          grep -Rni "AUTO SCAN" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "========== NET ACCUMULATION =========="

          grep -Rni "NET SPOT ACCUMULATION" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "Source verification completed."


      # ==========================================
      # 12. Check Gradle
      # ==========================================
      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          gradle --version


      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build Anteater v24
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo
          echo "========================================"
          echo "BUILDING ANTEATER v24"
          echo "========================================"

          gradle clean :app:assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"


      # ==========================================
      # 14. Show build log
      # ==========================================
      - name: Show build log
        if: always()
        shell: bash
        run: |
          if [ -f build.log ]; then

            echo
            echo "========================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "========================================"

            tail -n 300 build.log

          fi


      # ==========================================
      # 15. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -eux

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Build output:"

            find \
              "$PROJECT_DIR/app/build" \
              -type f \
              | sort \
              | tail -200

            exit 1
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/Anteater-v24.apk


      # ==========================================
      # 16. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -eux

          test -f \
            release/Anteater-v24.apk

          ls -lh \
            release/Anteater-v24.apk

          echo
          echo "APK successfully generated."


      # ==========================================
      # 17. Upload APK artifact
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v24-APK
          path: release/Anteater-v24.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 18. Create GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v24-${{ github.run_number }}

          name: Anteater v24 - Build ${{ github.run_number }}

          body: |
            Anteater v24 Android APK

            Version:
            24.0

            Build environment:
            - Android SDK 36
            - Build Tools 36.0.0
            - Java 17
            - Gradle 8.13

            Features:
            - Anteater branding
            - AUTO SCAN
            - Background scanning
            - NET SPOT ACCUMULATION
            - CEX + DEX
            - Spot-only accumulation
            - Circulating supply
            - Background notifications

          files: |
            release/Anteater-v24.apk

          generate_release_notes: false
