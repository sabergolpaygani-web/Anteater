name: Build Anteater v24

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Anteater v24 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version


      # ==========================================
      # 4. Install Android SDK 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ==========================================
      # 5. Verify Android SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK 36 OK"
          echo "Build Tools 36.0.0 OK"


      # ==========================================
      # 6. Install Gradle 8.13
      # ==========================================
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      # ==========================================
      # 7. Check Anteater v24 ZIP
      # ==========================================
      - name: Check Anteater v24 source
        shell: bash
        run: |
          set -eux

          test -f Anteater_24_FINAL.zip

          echo "Anteater_24_FINAL.zip found."


      # ==========================================
      # 8. Extract Anteater v24
      # ==========================================
      - name: Extract Anteater v24
        shell: bash
        run: |
          set -eux

          rm -rf anteater-src

          mkdir -p anteater-src

          unzip -q Anteater_24_FINAL.zip -d anteater-src

          echo "Extracted Anteater source:"
          find anteater-src -maxdepth 5 -type f | sort | head -250


      # ==========================================
      # 9. Locate Android project
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -eux

          APP_GRADLE=$(find anteater-src \
            -type f \
            -path "*/app/build.gradle.kts" \
            | head -1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR:"
            echo "app/build.gradle.kts was not found."

            find anteater-src \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "APP_GRADLE=$APP_GRADLE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 10. Verify Anteater source
      # ==========================================
      - name: Verify Anteater v24
        shell: bash
        run: |
          set -eux

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/example/spotvolume/MainActivity.kt"

          echo
          echo "========== VERSION =========="

          grep -n "versionCode" \
            "$PROJECT_DIR/app/build.gradle.kts" || true

          grep -n "versionName" \
            "$PROJECT_DIR/app/build.gradle.kts" || true

          echo
          echo "========== ANTEATER =========="

          grep -Rni "Anteater" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "========== AUTO SCAN =========="

          grep -Rni "AUTO SCAN" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "========== NET ACCUMULATION =========="

          grep -Rni "NET SPOT ACCUMULATION" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "Source verification completed."


      # ==========================================
      # 11. Show Gradle version
      # ==========================================
      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          gradle --version


      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build Anteater v24
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "Building Anteater v24"
          echo "========================================"

          gradle clean :app:assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"


      # ==========================================
      # 13. Display build log
      # ==========================================
      - name: Show build log
        if: always()
        shell: bash
        run: |
          if [ -f build.log ]; then

            echo
            echo "========================================"
            echo "LAST 250 LINES OF BUILD LOG"
            echo "========================================"

            tail -n 250 build.log

          fi


      # ==========================================
      # 14. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -eux

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Build directory:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort \
              | tail -200

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/Anteater-v24.apk


      # ==========================================
      # 15. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -eux

          test -f release/Anteater-v24.apk

          ls -lh release/Anteater-v24.apk

          echo
          echo "APK successfully generated."


      # ==========================================
      # 16. Upload APK artifact
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v24-APK
          path: release/Anteater-v24.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 17. Create GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v24-${{ github.run_number }}
          name: Anteater v24 — Build ${{ github.run_number }}

          body: |
            Anteater v24 Android APK

            Version:
            24.0

            Build:
            Android SDK 36
            Build Tools 36.0.0
            Java 17
            Gradle 8.13

            Features:
            - Anteater branding
            - AUTO SCAN
            - Background scanning
            - NET SPOT ACCUMULATION
            - CEX + DEX
            - Spot-only accumulation
            - Circulating supply
            - Background notifications

          files: |
            release/Anteater-v24.apk

          generate_release_notes: false
