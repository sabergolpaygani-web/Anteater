name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Anteater project
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING ANTEATER"
          echo "======================================"

          if [ ! -f "Anteater_15.zip" ]; then
            echo "::error::Anteater_15.zip not found"
            exit 1
          fi

          rm -rf build-src
          mkdir -p build-src

          unzip -q "Anteater_15.zip" -d build-src

          echo ""
          echo "Extracted files:"
          find build-src -maxdepth 4 -type f | sort | head -200

      - name: Find Android project
        run: |
          set -e

          SETTINGS_FILE=$(find build-src \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          ANDROID_PROJECT=$(dirname "$SETTINGS_FILE")

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "$ANDROID_PROJECT"

          echo "ANDROID_PROJECT=$ANDROID_PROJECT" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          pwd

          find . -maxdepth 4 -type f | sort

      - name: Build Anteater APK
        run: |
          set +e

          cd "$ANDROID_PROJECT"

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo "BUILDING ANTEATER APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "GRADLE EXIT CODE: $BUILD_EXIT"
          echo "======================================"

          echo "BUILD_EXIT=$BUILD_EXIT" >> "$GITHUB_ENV"

          exit 0

      - name: Put Gradle error in Summary
        if: always()
        run: |
          echo "# Anteater Gradle Build Diagnostic" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Gradle exit code:** ${BUILD_EXIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Gradle output" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then

            echo "===== IMPORTANT ERROR INFORMATION =====" >> "$GITHUB_STEP_SUMMARY"

            grep -n -A 25 -B 10 \
              -Ei \
              "FAILURE:|What went wrong|Execution failed|Caused by:|Unresolved reference|Type mismatch|Could not resolve|Could not find|Compilation error|error:" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -250 >> "$GITHUB_STEP_SUMMARY" \
              || true

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "===== LAST 150 LINES =====" >> "$GITHUB_STEP_SUMMARY"

            tail -150 "$GITHUB_WORKSPACE/build.log" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "build.log was not created." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Find generated APK
        if: always()
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find build-src \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Stop if Gradle failed
        if: always()
        run: |
          echo "======================================"
          echo "BUILD STATUS"
          echo "======================================"

          echo "Gradle exit code: ${BUILD_EXIT:-unknown}"

          if [ "${BUILD_EXIT:-1}" -ne 0 ]; then
            echo ""
            echo "GRADLE BUILD FAILED"
            echo ""
            echo "The actual Gradle error has been placed in the Run Summary."
            exit 1
          fi

      - name: Prepare APK
        if: success()
        run: |
          set -e

          echo "======================================"
          echo "PREPARING APK"
          echo "======================================"

          mkdir -p release

          APK=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "release/Anteater.apk"

          echo ""
          echo "Final APK:"
          ls -lh "release/Anteater.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-APK
          path: release/Anteater.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-${{ github.run_number }}
          name: Anteater APK - Build ${{ github.run_number }}
          files: release/Anteater.apk
          generate_release_notes: false
