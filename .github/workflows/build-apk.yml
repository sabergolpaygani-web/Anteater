name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Anteater project
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          if [ ! -f "Anteater_15.zip" ]; then
            echo "::error::Anteater_15.zip not found"
            exit 1
          fi

          unzip -q "Anteater_15.zip" -d build-src

          echo "===== EXTRACTED PROJECT ====="
          find build-src -maxdepth 4 -type f | sort | head -200

      - name: Find Android project
        run: |
          set -e

          SETTINGS_FILE=$(find build-src -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          ANDROID_PROJECT=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$ANDROID_PROJECT"

          echo "ANDROID_PROJECT=$ANDROID_PROJECT" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "===== PROJECT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== BUILD GRADLE ====="
          cat build.gradle.kts

          echo "===== APP BUILD GRADLE ====="
          cat app/build.gradle.kts

      - name: Build Anteater APK
        id: gradle_build
        continue-on-error: true
        run: |
          cd "$ANDROID_PROJECT"

          rm -f "$GITHUB_WORKSPACE/gradle-build.log"

          echo "========================================"
          echo "STARTING GRADLE BUILD"
          echo "========================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            > "$GITHUB_WORKSPACE/gradle-build.log" 2>&1

          EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE: $EXIT_CODE"
          echo "========================================"

          echo "$EXIT_CODE" > "$GITHUB_WORKSPACE/gradle-exit-code.txt"

          exit 0

      - name: Extract exact Gradle error
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "========================================"
          echo "GRADLE DIAGNOSTIC"
          echo "========================================"

          if [ ! -f "$LOG" ]; then
            echo "::error::gradle-build.log was not created"
            exit 0
          fi

          EXIT_CODE=$(cat "$GITHUB_WORKSPACE/gradle-exit-code.txt" 2>/dev/null || echo "unknown")

          echo "Gradle exit code: $EXIT_CODE"

          echo ""
          echo "========================================"
          echo "LAST 120 LINES"
          echo "========================================"

          tail -120 "$LOG"

          echo ""
          echo "========================================"
          echo "IMPORTANT ERROR LINES"
          echo "========================================"

          grep -Ei \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Unresolved reference|Type mismatch|Could not resolve|Could not find|Compilation error|FAILED|Exception" \
            "$LOG" \
            | tail -80 \
            || true

      - name: Put exact error in GitHub Summary
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "# Anteater Gradle Build Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$GITHUB_WORKSPACE/gradle-exit-code.txt" ]; then
            echo "**Gradle exit code:** $(cat "$GITHUB_WORKSPACE/gradle-exit-code.txt")" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Exact Gradle error" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$LOG" ]; then
            grep -Ei \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Unresolved reference|Type mismatch|Could not resolve|Could not find|Compilation error|FAILED|Exception" \
              "$LOG" \
              | tail -100 \
              >> "$GITHUB_STEP_SUMMARY" \
              || true
          else
            echo "Build log not found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Last 80 lines" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$LOG" ]; then
            tail -80 "$LOG" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show error as annotations
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          if [ ! -f "$LOG" ]; then
            echo "::error::Gradle build log was not created."
            exit 0
          fi

          echo "========================================"
          echo "CREATING ERROR ANNOTATIONS"
          echo "========================================"

          ERRORS=$(grep -Ei \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Unresolved reference|Type mismatch|Could not resolve|Could not find|Compilation error|FAILED|Exception" \
            "$LOG" \
            | tail -20 \
            || true)

          if [ -z "$ERRORS" ]; then
            echo "::error::Gradle failed, but no standard error pattern was detected."
            echo "::error::Check the Gradle diagnostic section in the Summary."
          else
            while IFS= read -r line; do
              SAFE_LINE=$(echo "$line" | tr '\r\n' ' ' | cut -c1-900)
              echo "::error title=Gradle Build Error::$SAFE_LINE"
            done <<< "$ERRORS"
          fi

      - name: Upload Gradle diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-Gradle-Diagnostic
          path: |
            gradle-build.log
            gradle-exit-code.txt
          if-no-files-found: warn

      - name: Find generated APK
        if: always()
        run: |
          echo "===== APK SEARCH ====="

          find "$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            -print \
            || true

      - name: Stop if Gradle failed
        if: always()
        run: |
          EXIT_CODE=$(cat "$GITHUB_WORKSPACE/gradle-exit-code.txt" 2>/dev/null || echo "1")

          echo "Gradle exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error title=Anteater Build Failed::Gradle failed with exit code $EXIT_CODE. Open the Summary section for the exact error."
            exit 1
          fi

      - name: Prepare APK
        if: success()
        run: |
          set -e

          mkdir -p release

          APK=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "release/Anteater.apk"

          ls -lh release/Anteater.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-APK
          path: release/Anteater.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-${{ github.run_number }}
          name: Anteater APK - Build ${{ github.run_number }}
          files: release/Anteater.apk
          generate_release_notes: false
