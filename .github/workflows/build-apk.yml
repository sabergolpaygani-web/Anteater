name: Build Anteater v23

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Anteater v23
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # --------------------------------------------------
      # 4. Install required Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          yes | sdkmanager --licenses >/dev/null || true

      # --------------------------------------------------
      # 5. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0" \
            || true

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK 36 is ready."

      # --------------------------------------------------
      # 6. Gradle 8.13
      # --------------------------------------------------
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # --------------------------------------------------
      # 7. Prepare workspace
      # --------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          set -eux

          rm -rf anteater-src

          mkdir -p anteater-src

          test -f Anteater_23_FINAL.zip

          unzip -q Anteater_23_FINAL.zip -d anteater-src

          echo "Extracted files:"
          find anteater-src -maxdepth 3 -type f | sort | head -200

      # --------------------------------------------------
      # 8. Locate Android project
      # --------------------------------------------------
      - name: Locate Anteater Android project
        shell: bash
        run: |
          set -eux

          APP_GRADLE=$(find anteater-src -type f \
            -path "*/app/build.gradle.kts" \
            | head -1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            find anteater-src -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "APP_GRADLE=$APP_GRADLE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Verify Anteater v23 source
      # --------------------------------------------------
      - name: Verify Anteater v23 source
        shell: bash
        run: |
          set -eux

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/spotvolume/MainActivity.kt"

          echo
          echo "Checking version..."

          grep -n "versionName" \
            "$PROJECT_DIR/app/build.gradle.kts" || true

          echo
          echo "Checking Anteater branding..."

          grep -Rni "Anteater" \
            "$PROJECT_DIR/app/src/main" \
            | head -30 || true

          echo
          echo "Checking AUTO SCAN..."

          grep -Rni "AUTO SCAN" \
            "$PROJECT_DIR/app/src/main" \
            | head -20 || true

          echo
          echo "Checking NET SPOT ACCUMULATION..."

          grep -Rni "NET SPOT ACCUMULATION" \
            "$PROJECT_DIR/app/src/main" \
            | head -20 || true

          echo
          echo "Anteater v23 source verification completed."

      # --------------------------------------------------
      # 10. Check Gradle project
      # --------------------------------------------------
      - name: Verify Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux

          gradle --version

          echo
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradle.properties" \) \
            | sort

      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build Anteater v23
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "Starting Anteater v23 build..."

          gradle clean :app:assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # --------------------------------------------------
      # 12. Show build log if something failed
      # --------------------------------------------------
      - name: Show build log
        if: always()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "================ BUILD LOG ================"
            tail -n 200 build.log
            echo "==========================================="
          fi

      # --------------------------------------------------
      # 13. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -eux

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build" -type f | sort | tail -100
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Anteater-v23.apk"

          echo
          echo "APK information:"

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -20
          else
            echo "aapt not directly available; APK existence verified."
          fi

      # --------------------------------------------------
      # 14. Upload APK as GitHub Actions artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v23-APK
          path: release/Anteater-v23.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 15. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v23-${{ github.run_number }}
          name: Anteater v23 Build ${{ github.run_number }}
          body: |
            Anteater v23 Android APK

            Features included in the source:
            - Anteater branding
            - AUTO SCAN
            - Background scanning
            - NET SPOT ACCUMULATION
            - CEX + DEX
            - Spot-only accumulation detection
            - Android 36 build
          files: |
            release/Anteater-v23.apk
          generate_release_notes: false
