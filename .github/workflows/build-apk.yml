name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Anteater project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q Anteater_13.1_Cloud_Build.zip -d build-src

      - name: Build Anteater APK
        id: build_apk
        continue-on-error: true
        working-directory: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          status=${PIPESTATUS[0]}

          echo "## Gradle build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 "$GITHUB_WORKSPACE/gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-13.1-debug-apk
          path: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1
