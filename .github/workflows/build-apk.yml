name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Anteater project
        run: |
          rm -rf build-src
          unzip -q Anteater_13.1_Cloud_eslahi.zip -d build-src

      - name: Fix JVM target compatibility
        working-directory: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              insert = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

              s = s.replace("android {\n", insert, 1)

          p.write_text(s)
          PY

      - name: Build Anteater APK
        working-directory: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build-src/GlobalSpotVolume_Android_Accumulation_CEX_13/app/build/outputs/apk/debug/app-debug.apk release/Anteater-13.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v13.1.${{ github.run_number }}"
          name: "Anteater 13.1 - Build ${{ github.run_number }}"
          body: |
            Anteater 13.1 Android APK

            Spot accumulation scanner.
          files: |
            release/Anteater-13.1.apk
          make_latest: true
