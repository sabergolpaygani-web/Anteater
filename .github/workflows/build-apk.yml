name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Find Android project
        run: |
          echo "Searching gradlew..."
          find . -name gradlew -type f


      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          echo "Using: $GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          ./gradlew assembleRelease


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk" -type f


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-APK
          path: "**/*.apk"
