name: Build Anteater v23

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ---------------------------------------------------------
      # Extract ONLY Anteater_23_FINAL.zip
      # ---------------------------------------------------------
      - name: Extract Anteater v23
        shell: bash
        run: |
          set -e

          echo "Checking Anteater_23_FINAL.zip..."

          test -f Anteater_23_FINAL.zip

          rm -rf anteater_build
          mkdir -p anteater_build

          unzip -q Anteater_23_FINAL.zip -d anteater_build

          echo "Extracted files:"
          find anteater_build -maxdepth 4 -type f | sort

      # ---------------------------------------------------------
      # Verify that the correct source was extracted
      # ---------------------------------------------------------
      - name: Verify Anteater v23 source
        shell: bash
        run: |
          set -e

          echo "Checking required project files..."

          test -f anteater_build/app/build.gradle.kts
          test -f anteater_build/app/src/main/AndroidManifest.xml
          test -f anteater_build/app/src/main/java/com/example/spotvolume/MainActivity.kt

          echo "Checking Anteater branding..."

          grep -R "Anteater" anteater_build/app/src/main

          echo "Checking AUTO SCAN..."

          grep -R "AUTO SCAN" anteater_build/app/src/main/java

          echo "Checking NET SPOT ACCUMULATION..."

          grep -R "NET SPOT ACCUMULATION" \
            anteater_build/app/src/main/java

          echo "Checking background service..."

          grep -R "AnteaterScanService" \
            anteater_build/app/src/main/java

          echo "Checking version 23.0..."

          grep -R 'versionName = "23.0"' \
            anteater_build/app/build.gradle.kts

          echo "SOURCE VERIFICATION PASSED."

      # ---------------------------------------------------------
      # Build with GitHub's installed Gradle 8.13
      # No gradlew required
      # ---------------------------------------------------------
      - name: Build Anteater v23
        shell: bash
        run: |
          set -e

          cd anteater_build

          echo "Gradle version:"
          gradle --version

          echo "Starting Android build..."

          gradle clean :app:assembleDebug --stacktrace

      # ---------------------------------------------------------
      # Verify APK exists
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="anteater_build/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

          echo "APK information:"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            | sort -V \
            | tail -1)

          test -n "$AAPT"

          BADGING=$("$AAPT" dump badging "$APK")

          echo "$BADGING"

          echo "Checking application ID..."

          echo "$BADGING" | grep \
            "package: name='com.example.spotvolume'"

          echo "Checking version..."

          echo "$BADGING" | grep \
            "versionName='23.0'"

          echo "Checking application name..."

          echo "$BADGING" | grep \
            "label='Anteater'"

          echo "APK VERIFICATION PASSED."

      # ---------------------------------------------------------
      # Prepare APK for download/release
      # ---------------------------------------------------------
      - name: Prepare release APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            anteater_build/app/build/outputs/apk/debug/app-debug.apk \
            release/Anteater.apk

          echo "Release APK:"
          ls -lh release/Anteater.apk

      # ---------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v23-APK
          path: release/Anteater.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v23-${{ github.run_number }}
          name: Anteater v23 Build ${{ github.run_number }}
          generate_release_notes: false
          files: release/Anteater.apk
