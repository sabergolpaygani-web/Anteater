name: Build Anteater v23

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ---------------------------------------------------------
      # Extract ONLY Anteater_23_FINAL.zip
      # ---------------------------------------------------------

      - name: Extract Anteater v23
        shell: bash
        run: |
          set -e

          test -f Anteater_23_FINAL.zip

          rm -rf anteater_build
          mkdir -p anteater_build

          unzip -q Anteater_23_FINAL.zip -d anteater_build

          echo "Anteater v23 extracted."

      # ---------------------------------------------------------
      # Verify source
      # ---------------------------------------------------------

      - name: Verify Anteater v23 source
        shell: bash
        run: |
          set -e

          test -f anteater_build/settings.gradle.kts
          test -f anteater_build/build.gradle.kts
          test -f anteater_build/app/build.gradle.kts
          test -f anteater_build/app/src/main/AndroidManifest.xml
          test -f anteater_build/app/src/main/java/com/example/spotvolume/MainActivity.kt

          grep -R "Anteater" anteater_build/app/src/main
          grep -R "AUTO SCAN" anteater_build/app/src/main/java
          grep -R "NET SPOT ACCUMULATION" anteater_build/app/src/main/java
          grep -R "AnteaterScanService" anteater_build/app/src/main/java
          grep -R 'versionName = "23.0"' \
            anteater_build/app/build.gradle.kts

          echo "SOURCE VERIFICATION PASSED."

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------

      - name: Build Anteater v23
        shell: bash
        run: |
          set -o pipefail

          cd anteater_build

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed Android platforms:"
          sdkmanager --list_installed | grep "platforms;android-36" || true

          echo "Starting build..."

          gradle clean :app:assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee ../build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "================ BUILD LOG (LAST 120 LINES) ================"
          tail -n 120 ../build.log
          echo "============================================================="

          exit $BUILD_STATUS

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="anteater_build/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            | sort -V \
            | tail -1)

          test -n "$AAPT"

          BADGING=$("$AAPT" dump badging "$APK")

          echo "$BADGING"

          echo "$BADGING" | grep \
            "package: name='com.example.spotvolume'"

          echo "$BADGING" | grep \
            "versionName='23.0'"

          echo "$BADGING" | grep \
            "label='Anteater'"

          echo "APK VERIFICATION PASSED."

      # ---------------------------------------------------------
      # Prepare APK
      # ---------------------------------------------------------

      - name: Prepare release APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            anteater_build/app/build/outputs/apk/debug/app-debug.apk \
            release/Anteater.apk

          ls -lh release/Anteater.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v23-APK
          path: release/Anteater.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v23-${{ github.run_number }}
          name: Anteater v23 Build ${{ github.run_number }}
          generate_release_notes: false
          files: release/Anteater.apk
