
Yesterday 10:09 PM

بله. با توجه به وضعیت فعلی Anteater و اینکه شرطت این است که واقعاً رایگان باشد و از داخل ایران دردسر کمتری داشته باشد، من سه گزینه را این‌طور بررسی می‌کنم:

گزینه	هزینه واقعی	وابستگی به سرویس خارجی	مناسب Anteater	فارسی	کار روی کل پروژه
GitHub Copilot Free	رایگان	متوسط	⭐⭐⭐⭐	خوب	بله
OpenCode + Ollama	کاملاً رایگان در حالت Local	بسیار کم	⭐⭐⭐⭐⭐	خوب	بله
