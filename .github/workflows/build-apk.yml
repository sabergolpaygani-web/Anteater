name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Anteater project
        run: |
          rm -rf build-src
          unzip -q Anteater_13.1_Cloud_eslahi.zip -d build-src

      - name: Build Anteater APK
        id: build
        
        working-directory: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "### Gradle build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          head -n 180 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-build-log
          path: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13/build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: |
          echo "Anteater build failed."
          exit 1

      - name: Upload APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-13.1-APK
          path: build-src/GlobalSpotVolume_Android_Accumulation_CEX_13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
