name: Build Anteater APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

# اجازه ساخت Release توسط GitHub Actions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. دریافت Repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. Java 17
      # =========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # 3. Gradle 8.13
      # =========================================
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # =========================================
      # 4. پیدا کردن ZIP پروژه
      #
      # Anteater_15_FIXED.zip
      # یا
      # Anteater_15.zip
      # =========================================
      - name: Find and extract Anteater source
        shell: bash
        run: |
          set -e

          ZIP=""

          if [ -f "Anteater_15_FIXED.zip" ]; then
            ZIP="Anteater_15_FIXED.zip"

          elif [ -f "Anteater_15.zip" ]; then
            ZIP="Anteater_15.zip"

          else
            ZIP="$(find . -maxdepth 2 -type f -name 'Anteater_15*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Anteater source ZIP not found."
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP" -d build-src

          PROJECT_DIR="$(
            find build-src \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit \
            | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================
      # 5. بررسی پروژه
      # =========================================
      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/example/spotvolume/MainActivity.kt

          echo "Project structure OK."


      # =========================================
      # 6. تنظیم JVM روی Java 17
      # =========================================
      - name: Fix JVM target
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "jvmToolchain(17)" not in s:
              s = s.replace(
                  "android {",
                  """kotlin {
              jvmToolchain(17)
          }

          android {""",
                  1
              )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          p.write_text(s)

          print("JVM target configured for Java 17.")
          PY


      # =========================================
      # 7. ساخت APK
      # =========================================
      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          exit ${PIPESTATUS[0]}


      # =========================================
      # 8. نمایش خطای دقیق در صورت شکست
      # =========================================
      - name: Put Gradle error in Summary
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |

          echo "# Anteater Gradle Build Diagnostic" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Exact Gradle error" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          grep -E \
            -A 40 \
            -B 10 \
            "What went wrong|Execution failed|Compilation error|e: file:|Caused by:" \
            gradle-build.log \
            | tail -n 160 \
            >> "$GITHUB_STEP_SUMMARY" \
            || tail -n 160 gradle-build.log \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"


      # =========================================
      # 9. توقف در صورت شکست Build
      # =========================================
      - name: Stop if build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1


      # =========================================
      # 10. پیدا کردن APK ساخته شده
      # =========================================
      - name: Prepare APK
        shell: bash
        run: |

          set -e

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/Anteater.apk

          ls -lh release/Anteater.apk


      # =========================================
      # 11. ساخت GitHub Release
      # =========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-build-${{ github.run_number }}
          name: Anteater APK Build ${{ github.run_number }}
          body: |
            Anteater APK

            Build: ${{ github.run_number }}

            Built automatically by GitHub Actions.

            Download Anteater.apk below.
          files: |
            release/Anteater.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
