name: Build Anteater v23

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Anteater v23 source
        shell: bash
        run: |
          set -e

          echo "Checking Anteater_23_FINAL.zip..."

          test -f Anteater_23_FINAL.zip

          rm -rf anteater_build
          mkdir -p anteater_build

          unzip -q Anteater_23_FINAL.zip -d anteater_build

          echo "ZIP contents:"
          find anteater_build -maxdepth 3 -type f | sort

          test -f anteater_build/app/build.gradle.kts
          test -f anteater_build/app/src/main/AndroidManifest.xml
          test -f anteater_build/app/src/main/java/com/example/spotvolume/MainActivity.kt

          echo "Checking source for Anteater features..."

          grep -R 'Anteater' anteater_build/app/src/main || true
          grep -R 'AUTO SCAN' anteater_build/app/src/main || true
          grep -R 'NET SPOT ACCUMULATION' anteater_build/app/src/main || true

          grep -R 'AUTO SCAN' anteater_build/app/src/main/java
          grep -R 'NET SPOT ACCUMULATION' anteater_build/app/src/main/java
          grep -R 'AnteaterScanService' anteater_build/app/src/main/java

          echo "Source verification passed."

      - name: Build Anteater v23
        shell: bash
        run: |
          set -e

          cd anteater_build

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found inside Anteater_23_FINAL.zip"
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="anteater_build/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK found:"
          ls -lh "$APK"

          echo "APK metadata:"
          "$ANDROID_HOME/build-tools/"*/aapt dump badging "$APK" | head -20

          BADGING=$("$ANDROID_HOME/build-tools/"*/aapt dump badging "$APK")

          echo "$BADGING" | grep 'package: name='
          echo "$BADGING" | grep "versionName='23.0'"
          echo "$BADGING" | grep "label='Anteater'"

          echo "APK verification passed."

      - name: Prepare release APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            anteater_build/app/build/outputs/apk/debug/app-debug.apk \
            release/Anteater.apk

          ls -lh release/Anteater.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v23-APK
          path: release/Anteater.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v23-${{ github.run_number }}
          name: Anteater v23 Build ${{ github.run_number }}
          generate_release_notes: false
          files: release/Anteater.apk
