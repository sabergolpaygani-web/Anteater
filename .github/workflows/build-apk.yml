1. GitHub Copilot Free
برای شرایط فعلی تو، ساده‌ترین گزینه است چون Anteater همین الان روی GitHub قرار دارد.

GitHub در پلن Free فعلاً ۲۰۰۰ code completion در ماه و دسترسی محدود به Chat/Agent می‌دهد و نیاز به کارت بانکی ندارد. 

مزیت مهم برای Anteater این است که مستقیماً با Repository کار می‌کند و می‌تواند کد، Workflow، GitHub Actions و فایل‌های پروژه را بررسی کند.

نقطه ضعف: رایگان بودنش محدودیت دارد و دسترسی آن از ایران ممکن است بسته به وضعیت اتصال به GitHub/GitHub services متفاوت باشد. من نمی‌توانم تضمین کنم که بدون VPN همیشه در ایران در دسترس باشد.

برای تو: گزینه راحت برای شروع.

2. OpenCode + Ollama
این یکی برای پروژه Anteater خیلی جالب‌تر است.

OpenCode یک coding agent متن‌باز است و می‌تواند مستقیماً با مدل‌های Local کار کند. مستندات رسمی OpenCode اتصال مستقیم به Ollama را پشتیبانی می‌کنند. 

Ollama هم مدل را روی کامپیوتر خودت اجرا می‌کند؛ در حالت Local نه API پولی لازم داری و نه درخواست‌هایت برای سرویس ابری ارسال می‌شود. مدل‌های Local از نظر هزینه استفاده رایگان‌اند. 

برای کدنویسی حتی خود Ollama مدل‌هایی مثل Qwen3-Coder را به‌عنوان مدل مناسب coding معرفی می‌کند. 

ساختار پیشنهادی:

OpenCode → Ollama → Qwen3-Coder

یعنی:

Anteater GitHub
      ↓
   OpenCode
      ↓
    Ollama
      ↓
  Qwen3-Coder
مزیت بزرگ برای ایران این است که بعد از نصب مدل، اصلاً به API خارجی برای هر سؤال وابسته نیستی.

عیب اصلی: برای مدل‌های بزرگ، کامپیوتر نسبتاً قدرتمند لازم داری.

3. Qwen Code + مدل Local
Qwen Code برای کارهای Agentic مثل:

پیدا کردن خطای Build

اصلاح Kotlin

اصلاح Gradle

بررسی AndroidManifest

بررسی GitHub Actions

تغییر چند فایل همزمان

Refactor

اجرای دستورات پروژه

طراحی شده است. خود Qwen آن را یک coding agent متن‌باز معرفی می‌کند. 

اما یک نکته خیلی مهم: قبلاً Qwen Code را به‌عنوان «کاملاً رایگان» معرفی کرده بودیم؛ این دیگر دقیق نیست. Qwen OAuth Free در ۱۵ آوریل ۲۰۲۶ متوقف شده است. 

بنابراین برای اینکه واقعاً صفر هزینه داشته باشی، باید Qwen Code را با یک مدل Local مثل Qwen3-Coder از طریق Ollama اجرا کنی.

این حالت:

Qwen Code
    ↓
Ollama
    ↓
Qwen3-Coder
کاملاً Local است و برای ایران از نظر وابستگی به سرویس‌های تحریم‌شده/مسدودشده، گزینه بسیار مناسبی است.

برای خود Anteater من این ساختار را پیشنهاد می‌کنم
اگر بخواهیم واقعاً بدون پرداخت پول روی Anteater کار کنیم:

مسیر اصلی
OpenCode + Ollama + Qwen3-Coder

چون OpenCode می‌تواند کل پروژه را به‌صورت Agent بررسی کند و Ollama مدل را Local اجرا می‌کند. 

مسیر دوم
GitHub Copilot Free

برای کارهای سریع داخل GitHub و تکمیل کد. فعلاً ۲۰۰۰ completion ماهانه دارد. 

مسیر سوم
Qwen Code + Ollama + Qwen3-Coder

اگر بخواهی یک Agent تخصصی‌تر برای دستکاری چند فایل پروژه و رفع خطاهای Gradle/Android داشته باشی.

یک نکته مهم درباره Gemini
Gemini Code Assist Free را دیگر در این فهرست قرار نمی‌دهم. چون وضعیت آن تغییر کرده و Google اعلام کرده حساب‌های مصرف‌کننده Gemini Code Assist از ۱۸ ژوئن ۲۰۲۶ دیگر در IDE/CLI درخواست‌ها را پردازش نمی‌کنند. 

پس توصیه قدیمی که «Gemini Code Assist رایگان» را به‌عنوان گزینه اصلی معرفی می‌کرد، برای امروز دیگر معتبر نیست.

جمع‌بندی برای تو
اگر بخواهم فقط یک مسیر کاملاً رایگان و کم‌وابسته به محدودیت‌های ایران برای Anteater انتخاب کنم:

OpenCode + Ollama + Qwen3-Coder

و اگر کامپیوترت برای اجرای مدل Local ضعیف باشد، برویم سراغ GitHub Copilot Free.

اگر مشخصات کامپیوترت را بدهی (RAM، CPU و کارت گرافیک)، می‌توانم دقیق بگویم چه مدل Qwen3-Coder را می‌توانی کاملاً رایگان روی سیستم خودت اجرا کنی و حتی دستور نصبش را مرحله‌به‌مرحله برای Anteater بدهم.


من با همین گوشی میخام کار. ‌رو ادامه بدم

آها، پس شرایط کاملاً فرق می‌کند. اگر قرار است فقط با همین گوشی اندرویدی ادامه بدهی، گزینه‌های Local مثل Ollama را فعلاً کنار می‌گذاریم. برای Anteater، بهترین مسیر موبایلی این است:

۱. Qwen Coder — گزینه مناسب برای کار اصلی کدنویسی
Qwen Coder

نسخه وب Qwen Coder صراحتاً برای دستگاه‌های موبایل طراحی شده و امکان کار با کد و Export مستقیم به GitHub دارد. 

برای کارهایی مثل:

اصلاح build.gradle

اصلاح build-apk.yml

بررسی خطای GitHub Actions

تغییر Kotlin

بررسی ساختار پروژه Anteater

تولید فایل کامل

مناسب است.

۲. GitHub + Copilot
GitHub Mobile

این گزینه برای تو خیلی کاربردی است چون پروژه همین حالا روی GitHub است. GitHub Mobile روی Android وجود دارد و می‌توانی Repository، فایل‌ها، Pull Requestها و حتی Copilot Chat را از گوشی مدیریت کنی. 

حتی ویرایش فایل‌های Workflow هم از موبایل امکان‌پذیر است. 

۳. خود GitHub در Chrome + github.dev
اگر نخواهی برنامه دیگری نصب کنی، در Chrome می‌توانی Repository را با github.dev باز کنی.

این ویرایشگر:

رایگان است

داخل مرورگر اجرا می‌شود

syntax highlighting دارد

جست‌وجوی کد دارد

تغییرات را commit می‌کند. 

اما برای Anteater من این ترکیب را پیشنهاد می‌کنم
📱 گوشی Android
       │
       ├── Qwen Coder
       │      ↓
       │   تولید/اصلاح کد
       │
       ├── GitHub Mobile
       │      ↓
       │   Repository + Actions
       │
       └── Chrome / github.dev
              ↓
          ویرایش فایل‌ها
              ↓
        GitHub Actions
              ↓
          ساخت APK
یعنی اصلاً لازم نیست کامپیوتر داشته باشی.

و اتفاقاً مشکل فعلی Anteater هم همین‌جا قابل ادامه دادن است: تو Workflow را از گوشی تغییر می‌دهی، GitHub Actions روی سرور خودش APK را می‌سازد، و تو APK را با گوشی دانلود و نصب می‌کنی. GitHub Mobile امکان مشاهده Workflowها و اجرای/بررسی نتایج Actions را هم فراهم کرده است. 

اگر بخواهی، از اینجا به بعد می‌توانیم کل توسعه Anteater را فقط با همین گوشی ادامه بدهیم؛ من هم کدهای کامل را طوری می‌دهم که مستقیماً بتوانی در GitHub موبایل Copy/Paste کنی.


پس کد ها رو تغییر بده تا ادامه راه و بریم

حتماً. من کدها را برای ادامه کار با همین گوشی تغییر دادم.

مشکل اصلی Build #44 را هم هدف گرفتم: دیگر از android-actions/setup-android استفاده نمی‌کنیم؛ Workflow مستقیماً از SDK موجود روی سرور GitHub و sdkmanager استفاده می‌کند تا همان مرحله‌ای که در عکس قرمز شده بود دور زده شود.

