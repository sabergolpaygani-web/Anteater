name: Build Anteater v25

on:
  workflow_dispatch:
  push:
    paths:
      - "Anteater_25_FIXED.zip"
      - ".github/workflows/build-apk-v25.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID SDK: $SDK"

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools" \
                        "platforms;android-36" \
                        "build-tools;36.0.0"

      - name: Verify Anteater v25 source
        shell: bash
        run: |
          set -e

          test -f "Anteater_25_FIXED.zip"

          echo "Found:"
          ls -lh "Anteater_25_FIXED.zip"

      - name: Extract Anteater v25
        shell: bash
        run: |
          set -e

          rm -rf anteater-src
          mkdir -p anteater-src

          unzip -q "Anteater_25_FIXED.zip" -d anteater-src

          echo "Extracted files:"
          find anteater-src -maxdepth 3 -type f | sort | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find anteater-src \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find anteater-src \
              -type f \
              -name "settings.gradle" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project verification OK"

      - name: Build Anteater v25
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING ANTEATER v25"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/Anteater.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anteater-v25-APK
          path: release/Anteater.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteater-v25-${{ github.run_number }}
          name: Anteater v25
          files: release/Anteater.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
